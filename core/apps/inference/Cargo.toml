[package]
name = "inference"
version = "0.1.0"
edition = "2021"

[lib]
name = "inference"
crate-type = ["cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen-inference"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.28", features = ["cli"] }
burn = { version = "0.21", default-features = false, features = ["ndarray"] }
nnapi = { path = "../../crates/nnapi" }
safetensors = "0.3"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = "1"
fancy-regex = "0.13"
anyhow = "1"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
