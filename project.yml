name: BabyVault
options:
  bundleIdPrefix: com.babyvault
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

targets:
  BabyVault:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    dependencies:
      - framework: build/VaultFFI.xcframework
        embed: true
    sources:
      - path: .
        excludes:
          - "Info.plist"
          - "Package.swift"
          - "build_ios.sh"
          - "README.md"
          - "project.yml"
          - ".gitignore"
          - "BabyVault.xcodeproj"
          - "build"
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.babyvault.app
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_PREVIEWS: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: VAULT_FFI_AVAILABLE
